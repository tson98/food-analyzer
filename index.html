<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 음식 영양소 분석기</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />

  <style>
    /* ──────────────────────────────────────────────
       전역 변수 & 리셋
    ────────────────────────────────────────────── */
    :root {
      --green-soft : #d1fae5;
      --green-mid  : #6ee7b7;
      --green-main : #10b981;
      --green-dark : #065f46;
      --accent     : #f59e0b;
      --text-main  : #111827;
      --text-sub   : #6b7280;
      --card-bg    : #ffffff;
      --bg         : #f0fdf4;
      --radius     : 1.25rem;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
      background: var(--bg);
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    /* ── 폰 껍데기 ── */
    #phone {
      width: 100%;
      max-width: 390px;
      min-height: 100dvh;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    @media (min-width: 600px) {
      body { padding: 2rem 0; align-items: flex-start; background: #e5e7eb; }
      #phone {
        min-height: auto;
        border-radius: 2.5rem;
        box-shadow: 0 32px 80px rgba(0,0,0,.22), 0 0 0 10px #1f2937, 0 0 0 12px #374151;
        overflow: hidden;
      }
    }

    /* ── 스크롤 영역 ── */
    #scroll-area {
      flex: 1;
      overflow-y: auto;
      padding: 0 1.1rem 2rem;
      scroll-behavior: smooth;
    }
    #scroll-area::-webkit-scrollbar { display: none; }

    /* ── 헤더 ── */
    header {
      background: linear-gradient(135deg, #065f46 0%, #047857 60%, #10b981 100%);
      padding: 3rem 1.4rem 1.6rem;
      position: relative;
      overflow: hidden;
    }
    header::before {
      content: '';
      position: absolute; inset: 0;
      background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.04'%3E%3Ccircle cx='30' cy='30' r='28'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      background-size: 60px 60px;
    }
    header .leaf {
      position: absolute; right: -18px; top: -18px;
      font-size: 7rem; opacity: .12; transform: rotate(20deg);
      pointer-events: none; user-select: none;
    }
    header h1 {
      font-family: 'Nunito', sans-serif;
      font-weight: 900; font-size: 1.45rem;
      color: #fff; letter-spacing: -.02em; position: relative;
    }
    header p {
      color: #a7f3d0; font-size: .78rem; margin-top: .25rem;
      font-weight: 400; position: relative;
    }

    /* ── 카드 공통 ── */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 1.1rem 1.1rem;
      box-shadow: 0 2px 12px rgba(16,185,129,.08), 0 1px 3px rgba(0,0,0,.06);
    }

    /* ── API Key 섹션 ── */
    .api-label {
      font-size: .7rem; font-weight: 700;
      color: var(--green-dark); letter-spacing: .06em;
      text-transform: uppercase; margin-bottom: .45rem;
    }
    .api-row { display: flex; gap: .45rem; }
    .api-input {
      flex: 1; border: 1.5px solid #d1fae5;
      border-radius: .7rem; padding: .6rem .85rem;
      font-size: .82rem; color: var(--text-main);
      outline: none; transition: border-color .2s;
      font-family: 'Pretendard', sans-serif;
    }
    .api-input:focus { border-color: var(--green-main); }
    .api-input::placeholder { color: #a7f3d0; }
    .btn-save {
      background: var(--green-main); color: #fff;
      border: none; border-radius: .7rem; padding: .6rem 1rem;
      font-size: .82rem; font-weight: 700; cursor: pointer;
      transition: background .18s, transform .12s;
      white-space: nowrap;
      font-family: 'Pretendard', sans-serif;
    }
    .btn-save:hover { background: #059669; }
    .btn-save:active { transform: scale(.96); }
    .api-saved {
      font-size: .72rem; margin-top: .4rem;
      color: var(--green-main); font-weight: 600;
      display: none;
    }

    /* ── 업로드 영역 ── */
    #drop-zone {
      border: 2.5px dashed #6ee7b7;
      border-radius: var(--radius);
      background: #f0fdf4;
      min-height: 200px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: .6rem;
      cursor: pointer; transition: background .2s, border-color .2s;
      position: relative; overflow: hidden;
    }
    #drop-zone:hover { background: #d1fae5; border-color: var(--green-main); }
    #drop-zone.has-image { border-style: solid; border-color: var(--green-main); }
    #drop-zone .icon { font-size: 2.8rem; }
    #drop-zone .hint { font-size: .8rem; color: var(--text-sub); font-weight: 500; text-align: center; line-height: 1.5; }
    #preview-img {
      width: 100%; height: 100%;
      object-fit: cover; position: absolute; inset: 0;
      border-radius: calc(var(--radius) - 2px);
      display: none;
    }
    #drop-zone.has-image .icon,
    #drop-zone.has-image .hint { display: none; }

    /* ── 파일 인풋 숨김 ── */
    #file-input { display: none; }

    /* ── 버튼 그룹 ── */
    .btn-group { display: flex; gap: .6rem; }
    .btn-upload {
      flex: 1; background: white;
      border: 1.5px solid #6ee7b7;
      color: var(--green-dark); border-radius: .9rem;
      padding: .75rem; font-size: .82rem; font-weight: 700;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: .4rem;
      transition: all .18s; font-family: 'Pretendard', sans-serif;
    }
    .btn-upload:hover { background: #d1fae5; }
    .btn-analyze {
      flex: 1.3; background: var(--green-main);
      border: none; color: #fff; border-radius: .9rem;
      padding: .75rem; font-size: .85rem; font-weight: 800;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: .4rem;
      transition: all .2s; font-family: 'Pretendard', sans-serif;
      position: relative; overflow: hidden;
    }
    .btn-analyze:not(:disabled):hover { background: #059669; transform: translateY(-1px); box-shadow: 0 4px 16px rgba(16,185,129,.35); }
    .btn-analyze:active { transform: scale(.97); }
    .btn-analyze:disabled {
      background: #a7f3d0; color: #6ee7b7; cursor: not-allowed;
      box-shadow: none; transform: none;
    }

    /* ── 로딩 ── */
    #loading {
      display: none;
      flex-direction: column; align-items: center; gap: 1rem;
      padding: 2rem 0;
    }
    .spinner {
      width: 52px; height: 52px;
      border: 4px solid #d1fae5;
      border-top-color: var(--green-main);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p { font-size: .85rem; color: var(--text-sub); font-weight: 600; text-align: center; }
    #loading .dots::after {
      content: '';
      animation: dots 1.4s steps(3, end) infinite;
    }
    @keyframes dots {
      0%   { content: ''; }
      33%  { content: '.'; }
      66%  { content: '..'; }
      100% { content: '...'; }
    }

    /* ── 결과 섹션 ── */
    #result { display: none; animation: fadeUp .45s ease both; }
    @keyframes fadeUp {
      from { opacity:0; transform: translateY(16px); }
      to   { opacity:1; transform: translateY(0); }
    }

    .result-header {
      display: flex; align-items: center; gap: .7rem;
      margin-bottom: .5rem;
    }
    .food-emoji { font-size: 2.6rem; }
    .food-name {
      font-family: 'Nunito', sans-serif;
      font-size: 1.5rem; font-weight: 900;
      color: var(--text-main); letter-spacing: -.02em; line-height: 1.2;
    }
    .food-group-badge {
      display: inline-flex; align-items: center; gap: .3rem;
      background: #d1fae5; color: var(--green-dark);
      border-radius: 99px; padding: .28rem .8rem;
      font-size: .74rem; font-weight: 700; margin-top: .35rem;
    }

    /* ── 칼로리 대형 표시 ── */
    .kcal-box {
      background: linear-gradient(135deg, #065f46, #059669);
      border-radius: var(--radius); padding: 1.1rem;
      display: flex; align-items: center; justify-content: space-between;
      color: #fff; margin-top: .2rem;
    }
    .kcal-label { font-size: .72rem; font-weight: 700; opacity: .75; letter-spacing: .06em; text-transform: uppercase; }
    .kcal-val { font-family: 'Nunito', sans-serif; font-size: 2.4rem; font-weight: 900; letter-spacing: -.03em; }
    .kcal-unit { font-size: .85rem; font-weight: 600; opacity: .8; margin-left: .15rem; }
    .kcal-icon { font-size: 2.4rem; opacity: .35; }

    /* ── 매크로 바 ── */
    .macro-title {
      font-size: .7rem; font-weight: 800; letter-spacing: .07em;
      text-transform: uppercase; color: var(--text-sub); margin-bottom: .75rem;
    }
    .macro-item { margin-bottom: .9rem; }
    .macro-item:last-child { margin-bottom: 0; }
    .macro-row {
      display: flex; justify-content: space-between; align-items: baseline;
      margin-bottom: .32rem;
    }
    .macro-name { font-size: .82rem; font-weight: 700; color: var(--text-main); display: flex; align-items: center; gap: .35rem; }
    .macro-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .macro-grams { font-size: .82rem; font-weight: 800; color: var(--text-main); }
    .macro-unit { font-size: .68rem; font-weight: 500; color: var(--text-sub); margin-left: 1px; }
    .bar-track {
      height: 8px; background: #f3f4f6; border-radius: 99px; overflow: hidden;
    }
    .bar-fill {
      height: 100%; border-radius: 99px;
      transition: width 1s cubic-bezier(.4,0,.2,1);
      width: 0%;
    }

    /* ── 색상 테마별 ── */
    .color-carb  { background: #3b82f6; }
    .color-prot  { background: #f59e0b; }
    .color-fat   { background: #f43f5e; }
    .dot-carb    { background: #3b82f6; }
    .dot-prot    { background: #f59e0b; }
    .dot-fat     { background: #f43f5e; }

    /* ── 에러 ── */
    #error-box {
      display: none;
      background: #fff1f2; border: 1.5px solid #fecdd3;
      border-radius: var(--radius); padding: 1rem 1.1rem;
      color: #be123c; font-size: .82rem; font-weight: 600;
    }

    /* ── 섹션 간격 ── */
    .section { margin-top: .85rem; }

    /* ── 이미지 오버레이 변경 버튼 ── */
    #change-btn {
      position: absolute; bottom: .6rem; right: .6rem;
      background: rgba(0,0,0,.55); color: #fff;
      border: none; border-radius: .6rem; padding: .3rem .7rem;
      font-size: .72rem; font-weight: 700; cursor: pointer;
      display: none; font-family: 'Pretendard', sans-serif;
      backdrop-filter: blur(4px);
    }
    #drop-zone.has-image #change-btn { display: block; }
  </style>
</head>
<body>

<!-- ════════════════════════════════════════════
     📱 폰 컨테이너
════════════════════════════════════════════ -->
<div id="phone">

  <!-- ── 헤더 ── -->
  <header>
    <span class="leaf">🥗</span>
    <h1>🍱 AI 영양소 분석기</h1>
    <p>음식 사진 한 장으로 영양 정보를 바로 확인하세요</p>
  </header>

  <!-- ── 스크롤 본문 ── -->
  <div id="scroll-area">

    <!-- API Key 입력 -->
    <div class="card section">
      <div class="api-label">🔑 Google Gemini API Key</div>
      <div class="api-row">
        <input
          type="password"
          id="api-key-input"
          class="api-input"
          placeholder="AIza... 형태의 키를 입력하세요"
          autocomplete="off"
        />
        <button class="btn-save" onclick="saveApiKey()">저장</button>
      </div>
      <div class="api-saved" id="api-saved-msg">✅ API 키가 저장되었습니다!</div>
      <p style="font-size:.7rem;color:#9ca3af;margin-top:.5rem;">
        키는 이 브라우저 탭 안에서만 사용되며 서버로 전송되지 않습니다.
      </p>
    </div>

    <!-- 이미지 업로드 영역 -->
    <div class="card section">
      <div class="api-label" style="margin-bottom:.6rem;">📸 음식 사진 업로드</div>
      <div id="drop-zone" onclick="document.getElementById('file-input').click()">
        <img id="preview-img" alt="미리보기" />
        <span class="icon">🍽️</span>
        <span class="hint">
          사진을 탭하여 업로드하거나<br />카메라로 직접 찍어보세요
        </span>
        <button id="change-btn" onclick="event.stopPropagation(); document.getElementById('file-input').click()">
          🔄 사진 변경
        </button>
      </div>
      <input
        type="file"
        id="file-input"
        accept="image/*"
        capture="environment"
        onchange="handleFile(event)"
      />
    </div>

    <!-- 버튼 그룹 -->
    <div class="btn-group section">
      <button class="btn-upload" onclick="document.getElementById('file-input').click()">
        📁 갤러리
      </button>
      <button
        class="btn-analyze"
        id="analyze-btn"
        disabled
        onclick="analyze()"
      >
        🔍 영양소 분석 시작
      </button>
    </div>

    <!-- 에러 메시지 -->
    <div id="error-box" class="section">⚠️ <span id="error-msg"></span></div>

    <!-- 로딩 -->
    <div id="loading" class="section">
      <div class="spinner"></div>
      <p>AI가 음식을 분석하고 있습니다<span class="dots"></span></p>
    </div>

    <!-- 결과 카드 -->
    <div id="result" class="section">

      <!-- 음식 이름 -->
      <div class="card">
        <div class="result-header">
          <span class="food-emoji" id="r-emoji">🍽️</span>
          <div>
            <div class="food-name" id="r-name">–</div>
            <div>
              <span class="food-group-badge">🌿 <span id="r-group">–</span></span>
            </div>
          </div>
        </div>
      </div>

      <!-- 칼로리 -->
      <div class="kcal-box section">
        <div>
          <div class="kcal-label">🔥 에너지</div>
          <div>
            <span class="kcal-val" id="r-kcal">–</span>
            <span class="kcal-unit">kcal</span>
          </div>
        </div>
        <span class="kcal-icon">⚡</span>
      </div>

      <!-- 매크로 -->
      <div class="card section">
        <div class="macro-title">💊 3대 영양소 (100g 기준)</div>

        <!-- 탄수화물 -->
        <div class="macro-item">
          <div class="macro-row">
            <span class="macro-name">
              <span class="macro-dot dot-carb"></span> 탄수화물
            </span>
            <span>
              <span class="macro-grams" id="r-carb">–</span>
              <span class="macro-unit">g</span>
            </span>
          </div>
          <div class="bar-track">
            <div class="bar-fill color-carb" id="bar-carb"></div>
          </div>
        </div>

        <!-- 단백질 -->
        <div class="macro-item">
          <div class="macro-row">
            <span class="macro-name">
              <span class="macro-dot dot-prot"></span> 단백질
            </span>
            <span>
              <span class="macro-grams" id="r-prot">–</span>
              <span class="macro-unit">g</span>
            </span>
          </div>
          <div class="bar-track">
            <div class="bar-fill color-prot" id="bar-prot"></div>
          </div>
        </div>

        <!-- 지방 -->
        <div class="macro-item">
          <div class="macro-row">
            <span class="macro-name">
              <span class="macro-dot dot-fat"></span> 지방
            </span>
            <span>
              <span class="macro-grams" id="r-fat">–</span>
              <span class="macro-unit">g</span>
            </span>
          </div>
          <div class="bar-track">
            <div class="bar-fill color-fat" id="bar-fat"></div>
          </div>
        </div>
      </div>

      <!-- 재분석 버튼 -->
      <button
        class="btn-analyze section"
        style="width:100%;"
        onclick="resetAnalysis()"
      >
        🔄 다른 음식 분석하기
      </button>

    </div><!-- /result -->

    <div style="height:1rem;"></div>
  </div><!-- /scroll-area -->
</div><!-- /phone -->

<!-- ════════════════════════════════════════════
     JavaScript
════════════════════════════════════════════ -->
<script>
/* ──────────────────────────────────────────
   ✏️ [초보자 수정 포인트 1]
   아래 API_KEY 변수에 직접 키를 넣으면
   앱 실행 시 자동으로 입력됩니다.
   빈 문자열('')이면 화면에서 직접 입력해야 합니다.
────────────────────────────────────────── */
const DEFAULT_API_KEY = '';   // 예) 'AIzaSyAbc123...'

/* ──────────────────────────────────────────
   ✏️ [초보자 수정 포인트 2]
   사용할 Gemini 모델명입니다.
   기본값: gemini-1.5-flash (빠르고 무료 할당량 넉넉)
────────────────────────────────────────── */
const GEMINI_MODEL = 'gemini-1.5-flash';

// ── 전역 상태 ──────────────────────────────
let apiKey   = DEFAULT_API_KEY;
let imageB64 = null;   // base64 문자열 (data: 접두어 제거)
let imageMime = null;  // 'image/jpeg' 등

// 앱 초기화: 기본 키가 있으면 입력창에 채워두기
window.addEventListener('DOMContentLoaded', () => {
  if (DEFAULT_API_KEY) {
    document.getElementById('api-key-input').value = DEFAULT_API_KEY;
    showSavedMsg();
  }
});

// ── API Key 저장 ───────────────────────────
function saveApiKey() {
  const val = document.getElementById('api-key-input').value.trim();
  if (!val) { alert('API 키를 입력해 주세요.'); return; }
  apiKey = val;
  showSavedMsg();
}
function showSavedMsg() {
  const el = document.getElementById('api-saved-msg');
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 2500);
}

// ── 파일 선택 처리 ─────────────────────────
function handleFile(e) {
  const file = e.target.files[0];
  if (!file) return;

  // 유효성: 이미지 파일만 허용
  if (!file.type.startsWith('image/')) {
    showError('이미지 파일만 업로드할 수 있습니다.');
    return;
  }

  hideError();
  hideResult();

  const reader = new FileReader();
  reader.onload = (ev) => {
    const dataUrl = ev.target.result;

    // 미리보기
    const img = document.getElementById('preview-img');
    img.src = dataUrl;
    img.style.display = 'block';
    document.getElementById('drop-zone').classList.add('has-image');

    // Base64 파싱
    const [header, b64] = dataUrl.split(',');
    imageMime = header.match(/:(.*?);/)[1];
    imageB64  = b64;

    // 분석 버튼 활성화
    document.getElementById('analyze-btn').disabled = false;
  };
  reader.readAsDataURL(file);
}

// ── 영양소 분석 ────────────────────────────
async function analyze() {
  // ① API 키 확인
  const key = document.getElementById('api-key-input').value.trim() || apiKey;
  if (!key) { showError('API 키를 먼저 입력하고 저장해 주세요.'); return; }
  apiKey = key;

  // ② 이미지 확인
  if (!imageB64) { showError('사진을 먼저 업로드해 주세요.'); return; }

  showLoading(true);
  hideError();
  hideResult();

  /* ── Gemini API 프롬프트 ──────────────────
     ✏️ [초보자 수정 포인트 3]
     아래 prompt 문자열을 수정하면
     AI에게 다른 정보를 요청할 수 있습니다.
  ────────────────────────────────────────── */
  const prompt = `첨부된 사진 속 음식을 분석해서 반드시 아래의 JSON 형식으로만 답변해 줘. 다른 텍스트는 절대 포함하지 마. 마크다운 코드블록도 쓰지 마.
{
  "food_name": "음식 이름",
  "food_group": "식품구성군 이름 (예: 곡류, 고기·생선·달걀·콩류, 채소류, 과일류, 우유·유제품류, 유지·당류 중 하나 또는 복합)",
  "emoji": "음식을 잘 표현하는 이모지 1개",
  "calories": 500,
  "carbs": 60,
  "protein": 20,
  "fat": 15
}`;

  const requestBody = {
    contents: [
      {
        parts: [
          { text: prompt },
          {
            inline_data: {
              mime_type: imageMime,
              data: imageB64
            }
          }
        ]
      }
    ]
  };

  try {
    // ── Gemini REST API 호출 ─────────────────
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${apiKey}`;
    const res  = await fetch(url, {
      method : 'POST',
      headers: { 'Content-Type': 'application/json' },
      body   : JSON.stringify(requestBody)
    });

    if (!res.ok) {
      const err = await res.json();
      throw new Error(err?.error?.message || `HTTP ${res.status}`);
    }

    const data = await res.json();

    // ── 응답 텍스트 추출 ──────────────────────
    const rawText = data?.candidates?.[0]?.content?.parts?.[0]?.text;
    if (!rawText) throw new Error('AI 응답이 비어 있습니다.');

    // ── JSON 파싱 (마크다운 펜스 제거 후) ────
    const cleaned = rawText.replace(/```json|```/g, '').trim();
    const result  = JSON.parse(cleaned);

    renderResult(result);

  } catch (err) {
    showError('분석 오류: ' + err.message + ' — API 키와 인터넷 연결을 확인해 주세요.');
    console.error(err);
  } finally {
    showLoading(false);
  }
}

// ── 결과 렌더링 ────────────────────────────
function renderResult(d) {
  // 텍스트 채우기
  document.getElementById('r-emoji').textContent = d.emoji  || '🍽️';
  document.getElementById('r-name' ).textContent = d.food_name  || '알 수 없음';
  document.getElementById('r-group').textContent = d.food_group || '–';
  document.getElementById('r-kcal' ).textContent = d.calories   ?? '–';
  document.getElementById('r-carb' ).textContent = d.carbs      ?? '–';
  document.getElementById('r-prot' ).textContent = d.protein    ?? '–';
  document.getElementById('r-fat'  ).textContent = d.fat        ?? '–';

  // 프로그레스 바 (최대 기준값으로 백분율 계산)
  const total = (Number(d.carbs)||0) + (Number(d.protein)||0) + (Number(d.fat)||0);
  const pct   = (v) => total > 0 ? Math.round((v / total) * 100) : 0;

  // 잠깐 0으로 초기화 후 애니메이션
  ['bar-carb','bar-prot','bar-fat'].forEach(id => {
    document.getElementById(id).style.width = '0%';
  });

  requestAnimationFrame(() => {
    setTimeout(() => {
      document.getElementById('bar-carb').style.width = pct(d.carbs)   + '%';
      document.getElementById('bar-prot').style.width = pct(d.protein) + '%';
      document.getElementById('bar-fat' ).style.width = pct(d.fat)     + '%';
    }, 80);
  });

  // 결과 섹션 보이기
  const resultEl = document.getElementById('result');
  resultEl.style.display = 'block';

  // 스크롤 내리기
  setTimeout(() => {
    resultEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 100);
}

// ── 재분석 리셋 ────────────────────────────
function resetAnalysis() {
  // 이미지 초기화
  imageB64  = null;
  imageMime = null;
  document.getElementById('preview-img').style.display = 'none';
  document.getElementById('preview-img').src = '';
  document.getElementById('drop-zone').classList.remove('has-image');
  document.getElementById('file-input').value = '';
  document.getElementById('analyze-btn').disabled = true;

  hideResult();
  hideError();

  // 맨 위로 스크롤
  document.getElementById('scroll-area').scrollTo({ top: 0, behavior: 'smooth' });
}

// ── 유틸 ───────────────────────────────────
function showLoading(on) {
  document.getElementById('loading').style.display = on ? 'flex' : 'none';
  document.getElementById('analyze-btn').disabled  = on;
}
function showError(msg) {
  const box = document.getElementById('error-box');
  document.getElementById('error-msg').textContent = msg;
  box.style.display = 'block';
}
function hideError() { document.getElementById('error-box').style.display = 'none'; }
function hideResult() { document.getElementById('result').style.display  = 'none'; }
</script>
</body>
</html>
